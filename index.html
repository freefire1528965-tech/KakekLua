<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakekLua AI Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; white-space: pre-wrap; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .bot-message { background: #2a2a2a; color: #fff; align-self: flex-start; }
        .input-area { display: flex; padding: 12px; background: #1e1e1e; border-top: 1px solid #333; position: sticky; bottom: 0; width: 100%; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        .input-area button { padding: 12px 20px; background: #007bff; color: #fff; border: none; border-radius: 6px; margin-left: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-message">Halo bro! KakekLua siap ngobrol. Ketik santai buat ngobrol biasa, atau pakai format <b>map: NamaMap</b> kalau mau dibuatkan skrip Roblox!</div>
    </div>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau 'map: NamaMap'...">
        <button id="sendButton">Kirim</button>
    </div>

    <script>
        function getMessageMode(message) {
            const text = String(message || "").trim();
            const match = text.match(/^map\s*:\s*(.*)$/i);

            if (match) {
                const mapName = match[1].trim();
                if (!mapName) {
                    return { mode: "MAP_EMPTY", mapName: "" };
                }
                return { mode: "MAP_SCRIPT", mapName };
            }

            return { mode: "CHAT", message: text };
        }

        function appendMessage(sender, text) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender === "user" ? "user-message" : "bot-message"}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // FUNGSI UTAMA AI: Hubungkan ke endpoint API asli kamu di sini
        async function callAI(promptText) {
            try {
                // Tampilkan indikator loading sebentar
                const loadingId = "loading_" + Date.now();
                const chatContainer = document.getElementById("chat-container");
                const loadingDiv = document.createElement("div");
                loadingDiv.className = "message bot-message";
                loadingDiv.id = loadingId;
                loadingDiv.innerText = "KakekLua sedang mengetik...";
                chatContainer.appendChild(loadingDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // CONTOH: Jika kamu punya endpoint API sendiri, ganti URL fetch di bawah ini.
                // Jika sebelumnya project kamu pakai fungsi API tertentu, masukkan kembali di sini.
                /*
                const response = await fetch("URL_API_KAMU_DISINI", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await response.json();
                const replyText = data.reply || data.choices[0].message.content;
                */

                // SEMENTARA: Simulasi balasan cerdas sebelum kamu pasang API aslimu kembali
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Hapus tulisan loading
                document.getElementById(loadingId).remove();

                if (promptText.startsWith("Buatkan script Roblox Lua")) {
                    appendMessage("bot", `// Skrip Lua untuk Roblox\n-- Dibuat otomatis oleh KakekLua\n\nlocal player = game.Players.LocalPlayer\nprint("Script aktif untuk: ${promptText}")\n\n-- Tambahkan fungsi auto farm / teleport di sini`);
                } else {
                    appendMessage("bot", `Wah benar juga ya, bro! Ngomong-ngomong soal "${promptText}", gimana kalau kita bahas lebih lanjut atau mau cari skrip map game apa nih?`);
                }

            } catch (error) {
                console.error(error);
                const loader = document.querySelector(".bot-message:last-child");
                if (loader && loader.innerText === "KakekLua sedang mengetik...") loader.remove();
                appendMessage("bot", "Waduh, koneksi ke sistem AI lagi kendala nih bro. Coba ulangi ya!");
            }
        }

        async function handleSend() {
            const inputElement = document.getElementById("chatInput");
            const rawText = inputElement.value;
            if (!rawText.trim()) return;

            appendMessage("user", rawText);
            inputElement.value = "";

            const evaluated = getMessageMode(rawText);

            if (evaluated.mode === "MAP_EMPTY") {
                appendMessage("bot", "Tolong sebutkan nama map-nya ya, bro! Contoh: map: +1 Strength Grow Arms");
                return;
            }

            let finalPrompt = "";
            if (evaluated.mode === "MAP_SCRIPT") {
                finalPrompt = `Buatkan script Roblox Lua untuk map: ${evaluated.mapName}`;
            } else {
                finalPrompt = evaluated.message;
            }

            await callAI(finalPrompt);
        }

        document.getElementById("sendButton").addEventListener("click", handleSend);
        document.getElementById("chatInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSend();
        });
    </script>
</body>
</html>
