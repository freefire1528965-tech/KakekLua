<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakekLua AI Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; white-space: pre-wrap; line-height: 1.4; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .bot-message { background: #2a2a2a; color: #fff; align-self: flex-start; }
        .input-area { display: flex; padding: 12px; background: #1e1e1e; border-top: 1px solid #333; position: sticky; bottom: 0; width: 100%; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        .input-area button { padding: 12px 20px; background: #007bff; color: #fff; border: none; border-radius: 6px; margin-left: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-message">halo bro 😎 ada yang bisa saya bantu?</div>
    </div>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan di sini...">
        <button id="sendButton">Kirim</button>
    </div>

    <script>
        // Menyimpan riwayat percakapan agar bot ingat konteks ngobrol sebelumnya
        let chatHistory = [];

        function appendMessage(sender, text) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender === "user" ? "user-message" : "bot-message"}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Logika Kecerdasan Respon Alami Berdasarkan Konteks Chat
        async function getSmartAIResponse(userMessage) {
            const text = userMessage.toLowerCase().trim();

            // Simpan ke riwayat memori percakapan
            chatHistory.push(text);

            // Simulasi jeda pengetikan agar terasa natural
            await new Promise(resolve => setTimeout(resolve, 700));

            // 1. Percakapan Sapaan / Normal
            if (text.includes("halo") || text.includes("hai") || text.includes("p ")) {
                return "halo juga bro 😎 ada yang bisa saya bantu?";
            }
            if (text.includes("lagi ngapain") || text.includes("lagi sibuk")) {
                return "lagi standby nih wkwk 😎 ada yang mau dibuat atau ditanyakan?";
            }

            // 2. Saat user bilang mau cari skrip (Bot JANGAN langsung kasih skrip, tapi tanya balik)
            if (text.includes("cari script") || text.includes("butuh script") || text.includes("mau script") || text.includes("bikin script")) {
                return "siap bro, script buat apa?";
            }

            // 3. Konteks lanjutan saat user menyebutkan game/kebutuhan
            if (chatHistory.some(msg => msg.includes("cari script") || msg.includes("butuh script") || msg.includes("mau script") || msg.includes("bikin script"))) {
                if (text.includes("game") || text.includes("simulator") || text.includes("map") || text.includes("buat game")) {
                    return "oke bro, game apa?";
                }
            }

            // 4. Jika user sudah menyebutkan nama game/map, baru berikan skripnya atau tanyakan detail fiturnya
            if (text.includes("map:") || chatHistory.length > 4) {
                return `// Skrip Roblox Lua Berhasil Dibuat!\n-- Disesuaikan dengan kebutuhanmu\n\nlocal player = game.Players.LocalPlayer\nprint("KakekLua Script Aktif!");\n\n-- Silakan sesuaikan koordinat atau fungsi auto-farm di sini`;
            }

            // 5. Default balasan ngobrol santai umum
            return `oh begitu bro. ngomong-ngomong soal "${userMessage}", ada detail khusus atau fitur lain yang mau ditambahkan?`;
        }

        async function handleSend() {
            const inputElement = document.getElementById("chatInput");
            const rawText = inputElement.value;
            if (!rawText.trim()) return;

            // Tampilkan pesan user
            appendMessage("user", rawText);
            inputElement.value = "";

            // Tampilkan indikator loading bot
            const loadingId = "loading_" + Date.now();
            const chatContainer = document.getElementById("chat-container");
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot-message";
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "sedang mengetik...";
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Dapatkan respon cerdas
            const botReply = await getSmartAIResponse(rawText);

            // Hapus loading dan tampilkan balasan bot
            document.getElementById(loadingId).remove();
            appendMessage("bot", botReply);
        }

        document.getElementById("sendButton").addEventListener("click", handleSend);
        document.getElementById("chatInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSend();
        });
    </script>
</body>
</html>
