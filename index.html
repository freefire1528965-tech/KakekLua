<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakekLua AI Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; white-space: pre-wrap; line-height: 1.4; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .bot-message { background: #2a2a2a; color: #fff; align-self: flex-start; }
        .input-area { display: flex; padding: 12px; background: #1e1e1e; border-top: 1px solid #333; position: sticky; bottom: 0; width: 100%; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        .input-area button { padding: 12px 20px; background: #007bff; color: #fff; border: none; border-radius: 6px; margin-left: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-message">Halo juga bro 😎 ada yang bisa saya bantu?</div>
    </div>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau 'map: NamaMap'...">
        <button id="sendButton">Kirim</button>
    </div>

    <script>
        // Riwayat memori percakapan untuk konteks multi-turn
        let chatHistory = [];

        // 1. EVALUASI TRIGGER MODE SCRIPT (Hanya jika diawali persis dengan "map:")
        function evaluateInputMode(rawMessage) {
            const text = String(rawMessage || "").trim();
            const mapTriggerMatch = text.match(/^map\s*:\s*(.*)$/i);

            if (mapTriggerMatch) {
                const mapInfo = mapTriggerMatch[1].trim();
                return {
                    mode: "SCRIPT_MODE",
                    targetMap: mapInfo
                };
            }

            return {
                mode: "CHAT_MODE",
                message: text
            };
        }

        function appendMessage(sender, text) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender === "user" ? "user-message" : "bot-message"}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 2. LOGIKA PEMAHAMAN KONTEKS & RESPON AI YANG DINAMIS
        async function getKakekLuaAIResponse(evaluatedResult, originalUserText) {
            chatHistory.push(originalUserText);

            await new Promise(resolve => setTimeout(resolve, 700));

            // --- JIKA MASUK MODE SCRIPT (Hanya lewat trigger "map:") ---
            if (evaluatedResult.mode === "SCRIPT_MODE") {
                const mapName = evaluatedResult.targetMap;
                
                if (!mapName) {
                    return "Mode Script aktif, bro! Tapi nama map-nya belum disebutin. Contoh: map: Race Egg";
                }

                return `// KakekLua Script Hub [MODE SCRIPT AKTIF]\n-- Target Map: ${mapName}\n\nlocal player = game.Players.LocalPlayer\nprint("Script otomatis aktif untuk map: ${mapName}!");\n\n-- Tambahkan fungsi script di sini`;
            }

            // --- JIKA PERCAKAPAN BIASA (Menganalisis pesan terbaru & konteks) ---
            const lowerText = originalUserText.toLowerCase();

            // A. Menanggapi Pencarian Script / Bantuan Script secara Natural
            if (lowerText.includes("cari script") || lowerText.includes("butuh script") || lowerText.includes("mau script") || lowerText.includes("bikin script")) {
                return "Siap bro 😎 script apa yang lagi lu cari?";
            }

            // B. Menanggapi Sapaan
            if (lowerText.match(/^(halo|hai|p|assalamu[']?alaikum)/)) {
                return "Halo juga bro 😎 ada yang bisa saya bantu?";
            }

            // C. Menanggapi Pertanyaan "Lagi ngapain" / Kondisi Bot
            if (lowerText.includes("lagi ngapain") || lowerText.includes("lagi sibuk")) {
                return "Lagi standby aja nih nungguin lu wkwk 😎 ada yang mau dibahas atau ditanyakan?";
            }

            // D. Menanggapi Kendala Map/Error (Tanpa Trigger SCRIPT_MODE)
            if (lowerText.includes("error") || lowerText.includes("masalah") || lowerText.includes("bug")) {
                return `Wah, kenapa tuh errornya? Coba ceritain detail kendalanya biar bisa dibantu cek, bro.`;
            }

            // E. Konteks Lanjutan (Jika sebelumnya user bilang cari script, lalu merespons nama game/fitur)
            const previousMessage = chatHistory.length > 1 ? chatHistory[chatHistory.length - 2].toLowerCase() : "";
            if (previousMessage.includes("cari script") || previousMessage.includes("butuh script")) {
                return `Oke bro, paham. Untuk ${originalUserText}, lu mau nambahin fitur spesifik kayak auto farm atau teleport?`;
            }

            // F. Default Respons Relevan Berdasarkan Teks Terbaru
            return `Oh begitu bro, ngomongin soal "${originalUserText}", ada hal khusus yang mau didiskusikan lagi?`;
        }

        // 3. HANDLER PENGIRIMAN PESAN
        async function handleSend() {
            const inputElement = document.getElementById("chatInput");
            const rawText = inputElement.value;
            if (!rawText.trim()) return;

            appendMessage("user", rawText);
            inputElement.value = "";

            const loadingId = "loading_" + Date.now();
            const chatContainer = document.getElementById("chat-container");
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot-message";
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "KakekLua sedang mengetik...";
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const evaluated = evaluateInputMode(rawText);
            const botReply = await getKakekLuaAIResponse(evaluated, rawText);

            document.getElementById(loadingId).remove();
            appendMessage("bot", botReply);
        }

        document.getElementById("sendButton").addEventListener("click", handleSend);
        document.getElementById("chatInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSend();
        });
    </script>
</body>
</html>
