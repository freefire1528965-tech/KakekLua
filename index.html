<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakekLua AI Hub</title>
    <style>
        /* Desain standar agar UI tidak rusak */
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .bot-message { background: #2a2a2a; color: #fff; align-self: flex-start; }
        .input-area { display: flex; padding: 10px; background: #1e1e1e; border-top: 1px solid #333; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 4px; outline: none; }
        .input-area button { padding: 10px 20px; background: #007bff; color: #fff; border: none; border-radius: 4px; margin-left: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-message">Halo! KakekLua siap membantu kamu ngobrol atau mencari skrip Roblox. Ada yang bisa dibantu?</div>
    </div>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau 'map: NamaMap'...">
        <button id="sendButton">Kirim</button>
    </div>

    <script>
        // 1. Fungsi Filter Mode Pesan
        function getMessageMode(message) {
            const text = String(message || "").trim();
            const match = text.match(/^map\s*:\s*(.*)$/i);

            if (match) {
                const mapName = match[1].trim();
                if (!mapName) {
                    return { mode: "MAP_EMPTY", mapName: "" };
                }
                return { mode: "MAP_SCRIPT", mapName };
            }

            return { mode: "CHAT", message: text };
        }

        // 2. Fungsi Menampilkan Pesan ke Layar
        function appendMessage(sender, text) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender === "user" ? "user-message" : "bot-message"}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 3. Fungsi Panggil AI API (Bisa disesuaikan dengan API lama kamu)
        async function callAI(promptText) {
            try {
                // Simulasi respons normal atau ganti dengan fetch API aslimu
                setTimeout(() => {
                    appendMessage("bot", "Halo bro! Pesan kamu sudah diterima: \"" + promptText + "\". Ada hal lain yang mau dibahas?");
                }, 500);
            } catch (error) {
                console.error(error);
                appendMessage("bot", "Waduh, sistem lagi ada kendala nih. Coba lagi ya!");
            }
        }

        // 4. Logika Tombol Kirim
        async function handleSend() {
            const inputElement = document.getElementById("chatInput");
            const rawText = inputElement.value;
            if (!rawText.trim()) return;

            // Tampilkan pesan user
            appendMessage("user", rawText);
            inputElement.value = "";

            // Evaluasi pesan menggunakan filter
            const evaluated = getMessageMode(rawText);

            if (evaluated.mode === "MAP_EMPTY") {
                appendMessage("bot", "Tolong sebutkan nama map-nya ya, bro! Contoh: map: +1 Strength Grow Arms");
                return;
            }

            let finalPayload = "";
            if (evaluated.mode === "MAP_SCRIPT") {
                finalPayload = `Buatkan script Roblox Lua untuk map: ${evaluated.mapName}`;
            } else {
                finalPayload = evaluated.message;
            }

            await callAI(finalPayload);
        }

        // Event Listener Tombol & Enter
        document.getElementById("sendButton").addEventListener("click", handleSend);
        document.getElementById("chatInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSend();
        });
    </script>
</body>
</html>
