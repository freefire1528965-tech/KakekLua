<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakekLua AI Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; white-space: pre-wrap; line-height: 1.4; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .bot-message { background: #2a2a2a; color: #fff; align-self: flex-start; }
        .input-area { display: flex; padding: 12px; background: #1e1e1e; border-top: 1px solid #333; position: sticky; bottom: 0; width: 100%; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        .input-area button { padding: 12px 20px; background: #007bff; color: #fff; border: none; border-radius: 6px; margin-left: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-message">Halo bro ada yg bisa kakek bantu 🤘</div>
    </div>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau 'map: NamaMap'...">
        <button id="sendButton">Kirim</button>
    </div>

    <script>
        let chatHistory = [];

        function appendMessage(sender, text) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender === "user" ? "user-message" : "bot-message"}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Database pencarian script otomatis berdasarkan nama map
        function searchScriptDatabase(mapName) {
            const cleanKey = mapName.toLowerCase().trim();
            
            const database = {
                "+1 kekuatan untuk menumbuhkan lengan anda": 'loadstring(game:HttpGet("https://api.jnkie.com/api/v1/luascripts/public/eb5ce9ad18c86812d14bb5064124df9a53e11b4f2bc9815d870d4f3bae04660c/download"))()',
                "race for egg": 'loadstring(game:HttpGet("https://raw.githubusercontent.com/fjr-code/race-for-egg.lua"))()'
            };

            if (database[cleanKey]) {
                return database[cleanKey];
            }
            
            // Fallback default jika nama map belum terdaftar di database lokal
            return 'loadstring(game:HttpGet("https://api.jnkie.com/api/v1/luascripts/public/eb5ce9ad18c86812d14bb5064124df9a53e11b4f2bc9815d870d4f3bae04660c/download"))()';
        }

        async function processAIResponse(rawUserMessage) {
            const text = String(rawUserMessage || "").trim();
            const lowerText = text.toLowerCase();

            chatHistory.push(text);

            await new Promise(resolve => setTimeout(resolve, 700));

            // ==========================================
            // MODE SCRIPT (Hanya aktif jika diawali "map:")
            // ==========================================
            const mapTriggerMatch = text.match(/^map\s*:\s*(.*)$/i);
            if (mapTriggerMatch) {
                let rawQuery = mapTriggerMatch[1].trim();

                if (!rawQuery) {
                    return "Formatnya kurang lengkap, bro. Contoh: map: race for egg";
                }

                let cleanMapName = rawQuery
                    .replace(/(ada gak\?*|ada gak|tolong carikan|saya butuh.*|butuh script.*|cari script.*)/gi, "")
                    .trim();

                if (!cleanMapName) {
                    cleanMapName = rawQuery;
                }

                const scriptResult = searchScriptDatabase(cleanMapName);
                return `${scriptResult}\n\n-- Target Map: ${cleanMapName}`;
            }

            // ==========================================
            // MODE CHAT NORMAL (Presisi & Luwes)
            // ==========================================
            if (lowerText.match(/^(halo|hai|p|assalamu[']?alaikum|hi)/)) {
                return "Halo juga bro! Ada script map apa nih yang mau kakek carikan 🤘";
            }

            if (lowerText.includes("ngobrol") || lowerText.includes("santai") || lowerText.includes("temenin")) {
                return "Boleh banget bro, santai aja. Lagi ngerjain project apa nih sekarang?";
            }

            if (lowerText.includes("apa kabar") || lowerText.includes("gimana kabarmu")) {
                return "Baik banget bro 😎 lu sendiri gimana, aman?";
            }

            if (lowerText.includes("bantuan") || lowerText.includes("tolong") || lowerText.includes("bisa bantu")) {
                return "Siap bro, tinggal bilang aja mau cari script map apa, nanti kakek cariin.";
            }

            if (lowerText.includes("cari script") || lowerText.includes("butuh script") || lowerText.includes("mau script")) {
                return "Gampang bro! Langsung ketik aja formatnya: map: [NamaMap] biar langsung dikasih kodenya 🤘";
            }

            if (lowerText.includes("error") || lowerText.includes("bug")) {
                return "Wah, error di bagian mana bro? Coba ceritain biar kakek bantu analisa.";
            }

            if (lowerText.includes("makasih") || lowerText.includes("terima kasih")) {
                return "Sama-sama bro! Kalau butuh script map lain tinggal ketik aja ya 😎";
            }

            // Respons natural jika tidak masuk kategori khusus (tanpa mengulang kalimat user)
            return "Mantap bro. Kalau mau nyari script game-nya, langsung pakai format 'map: [nama map]' ya biar langsung dapet kodenya 🤘";
        }

        async function handleSend() {
            const inputElement = document.getElementById("chatInput");
            const rawText = inputElement.value;
            if (!rawText.trim()) return;

            appendMessage("user", rawText);
            inputElement.value = "";

            const loadingId = "loading_" + Date.now();
            const chatContainer = document.getElementById("chat-container");
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot-message";
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "sedang mengetik...";
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const botReply = await processAIResponse(rawText);

            document.getElementById(loadingId).remove();
            appendMessage("bot", botReply);
        }

        document.getElementById("sendButton").addEventListener("click", handleSend);
        document.getElementById("chatInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSend();
        });
    </script>
</body>
</html>
