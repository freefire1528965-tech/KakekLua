<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakekLua AI Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; white-space: pre-wrap; line-height: 1.4; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .bot-message { background: #2a2a2a; color: #fff; align-self: flex-start; }
        .input-area { display: flex; padding: 12px; background: #1e1e1e; border-top: 1px solid #333; position: sticky; bottom: 0; width: 100%; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        .input-area button { padding: 12px 20px; background: #007bff; color: #fff; border: none; border-radius: 6px; margin-left: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-message">Halo bro! KakekLua siap ngobrol. Ketik santai buat ngobrol biasa, atau gunakan trigger <b>map: NamaMap</b> kalau mau masuk Mode Script!</div>
    </div>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau 'map: NamaMap'...">
        <button id="sendButton">Kirim</button>
    </div>

    <script>
        // Menyimpan memori percakapan agar asisten paham konteks multi-turn
        let conversationHistory = [];

        // 1. FUNGSI UTAMA: Evaluasi Trigger Mode Sesuai Aturan Ketat
        function evaluateInputMode(rawMessage) {
            const text = String(rawMessage || "").trim();

            // Cek apakah diawali persis dengan trigger "map:" (menggunakan regex case-insensitive)
            const mapTriggerMatch = text.match(/^map\s*:\s*(.*)$/i);

            if (mapTriggerMatch) {
                const mapInfo = mapTriggerMatch[1].trim();
                return {
                    mode: "SCRIPT_MODE",
                    targetMap: mapInfo // Bisa kosong jika user cuma ketik "map:" atau berisi nama map seperti "Race Egg"
                };
            }

            // Selain itu, semuanya mutlak dianggap percakapan biasa (CHAT_MODE)
            return {
                mode: "CHAT_MODE",
                message: text
            };
        }

        function appendMessage(sender, text) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender === "user" ? "user-message" : "bot-message"}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 2. KECERDASAN AI ASISTEN (Natural Conversational Flow)
        async function getKakekLuaAIResponse(evaluatedResult, originalUserText) {
            // Catat ke riwayat memori percakapan
            conversationHistory.push(originalUserText);

            // Simulasi jeda pengetikan natural (bisa diintegrasikan dengan API AI aslimu jika ada)
            await new Promise(resolve => setTimeout(resolve, 800));

            // --- JIKA MASUK MODE SCRIPT (Hanya via trigger "map:") ---
            if (evaluatedResult.mode === "SCRIPT_MODE") {
                const mapName = evaluatedResult.targetMap;
                
                if (!mapName) {
                    return "Mode Script aktif, bro! Tapi nama map-nya belum disebutin. Contoh: map: Race Egg";
                }

                return `// KakekLua Script Hub [MODE SCRIPT AKTIF]\n-- Target Map / Game: ${mapName}\n\nlocal player = game.Players.LocalPlayer\nprint("Auto farm aktif untuk map: ${mapName}!");\n\n-- Silakan sesuaikan logika skrip di sini sesuai kebutuhanmu.`;
            }

            // --- JIKA DALAM PERCAKAPAN BIASA (CHAT_MODE) ---
            const lowerText = originalUserText.toLowerCase();

            if (lowerText.includes("halo") || lowerText.includes("hai") || lowerText.includes("p")) {
                return "Halo juga bro 😎 ada yang bisa saya bantu?";
            }
            if (lowerText.includes("lagi ngapain") || lowerText.includes("sibuk")) {
                return "Lagi standby nih wkwk 😎 ada yang mau dibahas atau ditanyakan?";
            }
            if (lowerText.includes("script") || lowerText.includes("kode") || lowerText.includes("bikin")) {
                // Sesuai aturan: JANGAN langsung kirim script walau user sebut kata "script"
                return "Siap bro, ngomong-ngomong soal script, ada detail atau kendala apa yang mau diobrolin?";
            }
            if (lowerText.includes("map") && !lowerText.includes("map:")) {
                // Sesuai aturan: Sebut kata "map" biasa tetap dianggap chat biasa
                return "Oh soal map ya? Ceritain dulu dong bro, ada kendala apa atau mau didiskusikan bagian mananya?";
            }

            // Respon natural adaptif berdasarkan riwayat atau isi teks user
            return `Oh begitu bro. Mengenai "${originalUserText}", ada hal lain yang mau kita diskusikan?`;
        }

        // 3. HANDLER UTAMA KETIKA TOMBOL KIRIM DIKLIK
        async function handleSend() {
            const inputElement = document.getElementById("chatInput");
            const rawText = inputElement.value;
            if (!rawText.trim()) return;

            // Tampilkan pesan user ke UI
            appendMessage("user", rawText);
            inputElement.value = "";

            // Tampilkan indikator loading bot
            const loadingId = "loading_" + Date.now();
            const chatContainer = document.getElementById("chat-container");
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot-message";
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "KakekLua sedang mengetik...";
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Evaluasi pesan menggunakan aturan ketat trigger "map:"
            const evaluated = evaluateInputMode(rawText);

            // Dapatkan respon cerdas dari AI
            const botReply = await getKakekLuaAIResponse(evaluated, rawText);

            // Hapus loading dan tampilkan balasan bot
            document.getElementById(loadingId).remove();
            appendMessage("bot", botReply);
        }

        // Event Listener Tombol & Enter
        document.getElementById("sendButton").addEventListener("click", handleSend);
        document.getElementById("chatInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSend();
        });
    </script>
</body>
</html>
