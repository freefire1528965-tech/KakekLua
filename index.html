<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakek AI - Script Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #161b22; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .logo { font-size: 18px; font-weight: bold; color: #58a6ff; display: flex; align-items: center; gap: 8px; }
        .status { font-size: 12px; background: #238636; color: #fff; padding: 4px 10px; border-radius: 12px; }
        
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .user-message { background-color: #1f6feb; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background-color: #21262d; color: #c9d1d9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #30363d; }
        
        pre { background: #090d16; padding: 10px; border-radius: 6px; overflow-x: auto; margin-top: 8px; border: 1px solid #30363d; }
        code { color: #7ee787; font-family: monospace; font-size: 13px; }
        
        .copy-btn { background: #238636; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 8px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
        .copy-btn:hover { background: #2ea043; }

        .input-container { background-color: #161b22; padding: 15px 20px; display: flex; gap: 10px; border-top: 1px solid #30363d; }
        input { flex: 1; background-color: #0d1117; border: 1px solid #30363d; padding: 12px 15px; border-radius: 8px; color: #c9d1d9; font-size: 14px; outline: none; }
        input:focus { border-color: #58a6ff; }
        button.send-btn { background-color: #238636; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button.send-btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🤖 Kakek AI Chat Assistant</div>
        <div class="status">● Online</div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">
            Halo! Saya asisten pribadi kamu. Ketik game atau jenis script yang ingin kamu cari, nanti saya berikan kodenya di sini!
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Ketik permintaan script di sini..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Kirim</button>
    </div>

    <script>
        function appendMessage(sender, text, isCode = false, rawCode = "") {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
            
            if (isCode) {
                messageDiv.innerHTML = `<div>${text}</div><pre><code>${rawCode}</code></pre><button class="copy-btn" onclick="copyCode(this, \`${rawCode}\`)">📋 Salin Script</button>`;
            } else {
                messageDiv.innerText = text;
            }
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function copyCode(button, codeText) {
            navigator.clipboard.writeText(codeText).then(() => {
                button.innerText = "✅ Berhasil Disalin!";
                setTimeout(() => { button.innerText = "📋 Salin Script"; }, 2000);
            });
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage('user', text);
            inputField.value = "";

            setTimeout(() => {
                let sampleCode = `loadstring(game:HttpGet("https://raw.githubusercontent.com/KakekLua/main/scripts/${encodeURIComponent(text.replace(/\s+/g, ''))}.lua"))()`;
                appendMessage('bot', `Nih, script untuk "${text}" berhasil ditemukan:`, true, sampleCode);
            }, 1000);
        }
    </script>
</body>
</html>
