<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakekLua AI Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-wrap: break-word; white-space: pre-wrap; line-height: 1.4; }
        .user-message { background: #007bff; color: #fff; align-self: flex-end; }
        .bot-message { background: #2a2a2a; color: #fff; align-self: flex-start; }
        .input-area { display: flex; padding: 12px; background: #1e1e1e; border-top: 1px solid #333; position: sticky; bottom: 0; width: 100%; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #444; background: #2a2a2a; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        .input-area button { padding: 12px 20px; background: #007bff; color: #fff; border: none; border-radius: 6px; margin-left: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-message">Halo bro! KakekLua siap nemenin lu ngobrol. Ketik santai buat ngobrol biasa, atau pakai format <b>map: NamaMap</b> kalau mau langsung digasihi skrip Roblox-nya!</div>
    </div>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan atau 'map: NamaMap'...">
        <button id="sendButton">Kirim</button>
    </div>

    <script>
        function getMessageMode(message) {
            const text = String(message || "").trim();
            const match = text.match(/^map\s*:\s*(.*)$/i);

            if (match) {
                const mapName = match[1].trim();
                if (!mapName) {
                    return { mode: "MAP_EMPTY", mapName: "" };
                }
                return { mode: "MAP_SCRIPT", mapName };
            }

            return { mode: "CHAT", message: text };
        }

        function appendMessage(sender, text) {
            const chatContainer = document.getElementById("chat-container");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender === "user" ? "user-message" : "bot-message"}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Logika Respon Natural Tanpa Mengulang Teks User
        async function callAI(promptText, isScript) {
            const loadingId = "loading_" + Date.now();
            const chatContainer = document.getElementById("chat-container");
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot-message";
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "KakekLua sedang ngetik...";
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            await new Promise(resolve => setTimeout(resolve, 800));
            document.getElementById(loadingId).remove();

            const lowerText = promptText.toLowerCase();
            let reply = "";

            if (isScript) {
                reply = `// KakekLua Script Hub\n-- Target Map: ${promptText}\n\nlocal vu = game:GetService("VirtualUser")\ngame:GetService("Players").LocalPlayer.Idled:Connect(function()\n    vu:Button2Down(Vector2.new(0,0),workspace.CurrentCamera.CFrame)\n    task.wait(1)\n    vu:Button2Up(Vector2.new(0,0),workspace.CurrentCamera.CFrame)\nend)\n\nprint("Auto farm & Anti-AFK aktif untuk ${promptText}!");`;
            } else if (lowerText.includes("halo") || lowerText.includes("hai") || lowerText.includes("p")) {
                reply = "Wih, halo juga bro! Ada yang bisa Kakek bantu hari ini? Mau cari skrip game apa nih?";
            } else if (lowerText.includes("cerdas") || lowerText.includes("keren") || lowerText.includes("mantap")) {
                reply = "Wkwk santai bro, sebagai asisten andalan lu, Kakek pasti kasih yang terbaik. Mau dibikinin skrip buat map apa nih sekarang?";
            } else if (lowerText.includes("script") || lowerText.includes("skrip") || lowerText.includes("cari")) {
                reply = "Siap bro! Kalau mau nyari skrip, tinggal ketik format **map: NamaMap** ya di sini, nanti langsung Kakek buatkan skripnya.";
            } else if (lowerText.includes("terima kasih") || lowerText.includes("makasih")) {
                reply = "Sama-sama bro! Kalau ada kendala atau mau nambah fitur skrip lain, kabarin Kakek aja ya.";
            } else {
                // Jawaban umum yang ngalir natural tanpa mengutip teks user mentah-mentah
                reply = "Haha bener banget tuh, bro! Ada hal lain yang mau kita bahas atau mau dibikinin skrip otomatisasi buat game tertentu? Tinggal ketik map: [NamaMap]-nya ya!";
            }

            appendMessage("bot", reply);
        }

        async function handleSend() {
            const inputElement = document.getElementById("chatInput");
            const rawText = inputElement.value;
            if (!rawText.trim()) return;

            appendMessage("user", rawText);
            inputElement.value = "";

            const evaluated = getMessageMode(rawText);

            if (evaluated.mode === "MAP_EMPTY") {
                appendMessage("bot", "Tolong sebutkan nama map-nya dong, bro! Contoh: map: +1 Strength Grow Arms");
                return;
            }

            if (evaluated.mode === "MAP_SCRIPT") {
                await callAI(evaluated.mapName, true);
            } else {
                await callAI(evaluated.message, false);
            }
        }

        document.getElementById("sendButton").addEventListener("click", handleSend);
        document.getElementById("chatInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSend();
        });
    </script>
</body>
</html>
