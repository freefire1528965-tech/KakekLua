<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakekLua Management - Pro Script Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#090d16',
                        cardbg: '#111827',
                        accent: '#10b981',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="bg-darker text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800/60 bg-darker/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/30 text-black font-bold">
                    <i class="fa-solid fa-code text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-white via-slate-200 to-emerald-400 bg-clip-text text-transparent">KakekV1 Hub</h1>
                    <p class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Executor Script Hub Management</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    DELTA READY
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        
        <!-- Search & Control Box -->
        <div class="bg-cardbg/80 border border-slate-800 rounded-2xl p-4 shadow-xl backdrop-blur-sm">
            <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">
                <i class="fa-solid fa-magnifying-glass text-emerald-400 mr-1.5"></i> Cari Game / Script Hub
            </label>
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Ketik nama game (cth: Blox Fruits, Race for Egg)..." 
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium">
            </div>
        </div>

        <!-- Result Container / Script Cards -->
        <div id="resultContainer" class="space-y-4">
            <!-- Default Welcome State -->
            <div class="bg-cardbg/50 border border-slate-800/80 rounded-2xl p-6 text-center space-y-3">
                <div class="w-12 h-12 bg-slate-800 rounded-2xl mx-auto flex items-center justify-center text-emerald-400 text-xl">
                    <i class="fa-solid fa-terminal"></i>
                </div>
                <h3 class="font-bold text-sm text-slate-200">Hub Siap Digunakan</h3>
                <p class="text-xs text-slate-400 max-w-sm mx-auto">Ketik nama game di kolom pencarian di atas atau pilih script favorit kamu untuk disalin kodenya.</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/60 bg-darker py-4 text-center text-xs text-slate-500">
        <p>KakekLua Hub Management © 2026 • Powered by Delta Executor</p>
    </footer>

    <!-- Script Logic -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const resultContainer = document.getElementById('resultContainer');

        // Data database script ala Tora IsMe
        const scriptsDB = [
            {
                keyword: ['race for egg', 'egg', 'telur'],
                title: 'Race for Egg - Auto Farm & Ulti Script',
                status: 'PATCHED / TESTING',
                statusColor: 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                badges: ['KEYLESS', 'AUTO FARM'],
                code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/freefire1528965-tech/KakekLua/main/scripts/RaceForEgg.lua"))()`
            },
            {
                keyword: ['blox fruits', 'fruit', 'bloxfruit'],
                title: 'Blox Fruits - Hub Pro (Auto Farm & Sea Event)',
                status: 'WORKING',
                statusColor: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
                badges: ['KEY SYSTEM', 'AUTO LEVEL', 'ESP'],
                code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/scriptpastebin/raw/main/BloxFruitsHub"))()`
            },
            {
                keyword: ['pet simulator', 'ps99', 'pet 99'],
                title: 'Pet Simulator 99 - Auto Dig & Collect Gems',
                status: 'WORKING',
                statusColor: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
                badges: ['KEYLESS', 'AUTO FARM'],
                code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/scriptpastebin/raw/main/PS99AutoFarm"))()`
            }
        ];

        function renderCards(filterText = '') {
            const query = filterText.toLowerCase().trim();
            const filtered = scriptsDB.filter(item => 
                item.keyword.some(k => k.includes(query)) || item.title.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                resultContainer.innerHTML = `
                    <div class="bg-cardbg/50 border border-slate-800 rounded-2xl p-6 text-center space-y-2">
                        <i class="fa-solid fa-triangle-exclamation text-amber-400 text-2xl mb-1"></i>
                        <h3 class="font-bold text-sm text-slate-200">Script Tidak Ditemukan</h3>
                        <p class="text-xs text-slate-400">Coba kata kunci lain (contoh: "Blox Fruits" atau "Egg").</p>
                    </div>
                `;
                return;
            }

            resultContainer.innerHTML = filtered.map(item => `
                <div class="bg-cardbg border border-slate-800/80 rounded-2xl p-4 shadow-xl space-y-3 transition-all hover:border-slate-700">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${item.statusColor}">${item.status}</span>
                            <h2 class="font-bold text-sm text-slate-100 mt-1.5">${item.title}</h2>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                        ${item.badges.map(b => `<span class="bg-slate-800/80 text-slate-300 border border-slate-700/60 text-[9px] px-2 py-0.5 rounded font-semibold">${b}</span>`).join('')}
                    </div>
                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 flex items-center justify-between gap-2">
                        <div class="font-mono text-[11px] text-emerald-400 overflow-x-auto whitespace-nowrap p-1 select-all flex-1">
                            ${item.code}
                        </div>
                        <button onclick="copyScript(this, \`${item.code}\`)" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-2 rounded-lg shrink-0 transition-all flex items-center gap-1.5 shadow-lg shadow-emerald-900/20 active:scale-95">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', (e) => {
            renderCards(e.target.value);
        });

        function copyScript(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                btn.classList.add('bg-teal-500', 'text-black');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('bg-teal-500', 'text-black');
                    btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                }, 2000);
            });
        }

        // Load awal tampilkan semua
        renderCards();
    </script>
</body>
</html>
